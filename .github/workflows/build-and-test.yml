name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: [ '9.0.x', '10.0.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore src

      - name: Format check
        run: dotnet format src --verify-no-changes

      - name: Build
        run: dotnet build src --configuration Release --no-restore /p:Version=1.1.${{ github.run_number }}

      - name: Test
        run: dotnet test src --configuration Release --no-build /p:Version=1.1.${{ github.run_number }}

      - name: Pack (main only)
        if: github.ref == 'refs/heads/main' && matrix.dotnet-version == '10.0.x'
        run: dotnet pack src/OllamaClient/OllamaClient.csproj --configuration Release --no-build /p:Version=1.1.${{ github.run_number }}
